// Bay C (KRAB) content for the MFD Extended shared MAS monitor (host
// project "MFDExtension" - see its HOSTING.md for the full contract).
// Owned and shipped by KRAB-9000 itself, not by the host: MFDExtension
// only supplies the "not installed" fallback variant of this same page
// name (gated NEEDS[!KRAB9000], so exactly one of the two ever loads) and
// the button-C routing.
//
// The MASMonitor `page =` registration ships HERE, next to the page,
// under the same NEEDS - a page name registered in that list with no
// MAS_PAGE behind it makes MASMonitor.Start() throw and the whole monitor
// black-screen (confirmed in game 2026-08-19), so only the repo that
// guarantees the page's existence may register it. Keeping both nodes in
// this one file means the pair can never desync.
//
// NEEDS[AvionicsSystems&MFDExtension]: this node is meaningless without
// both the MAS runtime and the host framework present, even though the
// file only ships with KRAB-9000 anyway (so no NEEDS[KRAB9000] guard is
// needed here).
//
// Page name keeps the host's historical "_Placeholder" suffix because
// that's what the host's button-C routing and fallback both target -
// renaming it would need a coordinated change on the host side.
//
// Step 1 (current): minimal hello-world, same pattern used to prove out
// KRILL's and RealBattery's bays - just verifies the page renders
// end-to-end (registration + button-C routing + our content). Replace
// with real KRAB-9000 content once that design is agreed.

MAS_PAGE:NEEDS[AvionicsSystems&MFDExtension]
{
	name = MFDExt_KRAB_Placeholder

	TEXT
	{
		position = 12, 8
		text = KRAB-9000 MODULE
	}
	TEXT
	{
		position = 17, 9
		text = ONLINE
	}

	TEXT
	{
		position = 10, 11
		text = Hello from KRAB bay.
	}
	TEXT
	{
		position = 4, 12
		text = First formal verification page.
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&MFDExtension]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_KRAB_Placeholder
	}
}
