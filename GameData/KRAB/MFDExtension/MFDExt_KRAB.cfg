// Bay C (KRAB) content for the MFD Extended shared MAS monitor (host project
// "MFDExtension" - see its HOSTING.md for the full contract). Shipped by KRAB-9000;
// the host supplies only the NEEDS[!KRAB9000] fallback page and the button-C routing.
//
// The MASMonitor `page =` registration ships HERE, next to the page and under the
// same NEEDS: a page name in that list with no MAS_PAGE behind it makes
// MASMonitor.Start() throw and black-screens the whole monitor.
//
// The "_Placeholder" page name is what the host's button-C routing and fallback
// both target - renaming it needs a coordinated change on the host side.
//
// Minimal hello-world content: verifies registration, button-C routing and our
// page render end-to-end. Replace with real KRAB-9000 content.

MAS_PAGE:NEEDS[AvionicsSystems&MFDExtension]
{
	name = MFDExt_KRAB_Placeholder

	TEXT
	{
		position = 12, 8
		text = KRAB-9000 MODULE
	}
	TEXT
	{
		position = 17, 9
		text = ONLINE
	}

	TEXT
	{
		position = 10, 11
		text = Hello from KRAB bay.
	}
	TEXT
	{
		position = 4, 12
		text = First formal verification page.
	}
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&MFDExtension]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_KRAB_Placeholder
	}
}
