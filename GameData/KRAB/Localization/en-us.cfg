// KRAB-9000 localization — English (development master).
// All player-visible strings live here; other languages will be added once
// development settles.
//
// Comment convention (added 2026-07-17, for future translators): each key has
// a one-line comment directly above it saying WHERE it appears in the UI and,
// for keys with <<1>>/<<2>> placeholders, what they are substituted with.
// ModuleManager/KSP ignore these comments; they exist only for humans editing
// this file by hand.
Localization
{
	en-us
	{
		// Part

		// Part list entry name (VAB/SPH parts panel and part tooltip title).
		#LOC_KRAB_partTitle = KRAB-9000 Controller
		// Part tooltip description, shown when hovering the part in the parts panel.
		#LOC_KRAB_partDescription = Where the KAL-1000 plays back a hand-crafted sequence, the KRAB-9000 listens. Feed it stick inputs, autopilot commands or raw flight data and it will blend them all, through an alarmingly flexible node graph, into whatever your servos, engines and control surfaces should be doing right now. The Moving Parts Experts Group insists the crab-like pinching noises are purely coincidental.
		// Search keywords for the parts panel filter box — never shown as a sentence.
		#LOC_KRAB_partTags = control controller robot mix blend graph node axis input krab

		// Module (PAW)

		// Header of the module's block in the part's tooltip (right side of the parts panel).
		#LOC_KRAB_moduleName = KRAB Controller
		// Body text of the module's block in the part's tooltip.
		#LOC_KRAB_moduleInfo = Blends multiple inputs (player axes, autopilot output and vessel physics) through a node graph and drives part axes just like a KAL controller.
		// PAW (right-click menu) label for the editable KRAB instance name field.
		#LOC_KRAB_controllerName = KRAB Name
		// PAW label for the enable/disable checkbox.
		#LOC_KRAB_enabled = KRAB Controller
		// PAW label for the arbitration-priority slider (shared priority scheme with KAL).
		#LOC_KRAB_priority = Priority
