		#LOC_KRAB_tip_fam_script = What the vessel actually receives after SAS/MechJeb/other autopilots feed in. Often different from what the player pressed.
		// Hover on the VESSEL STATE family header in the source picker.
		#LOC_KRAB_tip_fam_physical = Live telemetry (speed, altitude, pressure and more), sampled at its own rate, independent of frame rate.
		// Hover on the ACTION GROUPS family header in the source picker.
		#LOC_KRAB_tip_fam_actionGroup = A stock or custom action group's current on/off state, as a 0/1 signal.
		// Hover on the PART FIELD family header in the source picker.
		#LOC_KRAB_tip_fam_partField = Reads a live value directly off a specific part, chosen by clicking it in the scene.
		// Hover on the KRAB INPUT SLOTS family header in the source picker.
		#LOC_KRAB_tip_fam_krabInput = One of this controller's 4 slots, assignable to a real Action Group from the game's own Action Groups menu.
		// Hover on the CONSTANT family header in the source picker.
		#LOC_KRAB_tip_fam_constant = A fixed number. Edit it after placing.
		// Hover on the OPERATORS family header in the source picker.
		#LOC_KRAB_tip_fam_operators = Turn this term into an operator instead of a plain source. Reaches ports '+ Term' can't, like nesting one filter inside another.
		#LOC_KRAB_tip_fam_trig = Pure math functions. Sin/Cos/Tan take degrees and return a ratio. Asin/Acos/Atan/Atan2 take a ratio and return degrees.
		// Hover on the REUSE A SIGNAL family header in the source picker.
		#LOC_KRAB_tip_fam_reuse = Wire in a node that already exists elsewhere in the graph, instead of creating a new one. The same value now feeds both places.

		// Hover on the Curve icon on a Remap term, in the tree.
		#LOC_KRAB_tip_curve = Open the response curve editor for this Remap
		// Hover on the vertical-flip button in the curve window's footer.
		#LOC_KRAB_tip_flipVertical = Flip the curve vertically (mirror the output)
		// Hover on the horizontal-flip button in the curve window's footer.
		#LOC_KRAB_tip_flipHorizontal = Flip the curve horizontally (mirror the input)
		// Hover on the footer's ids toggle button.
		#LOC_KRAB_tip_toggleIds = Show each term's node id (e.g. n4) next to its name — useful for telling REUSE A SIGNAL entries apart in a complex graph
		// Hover on the footer's highlight-priority toggle button.
		#LOC_KRAB_tip_togglePriority = When a part is both this output's target and one of its sources, which highlight wins

		// Hover on a Constant term's name in the tree.
		#LOC_KRAB_tip_node_Constant = A fixed numeric value
		// Hover on a KRAB Input term's name in the tree.
		#LOC_KRAB_tip_node_ControllerInput = One of this controller's 4 assignable input slots, driven by an Action Group
		// Hover on a Player Axis term's name in the tree.
		#LOC_KRAB_tip_node_PlayerAxis = Raw player stick input, before autopilot/SAS
		// Hover on an Effective Command term's name in the tree.
		#LOC_KRAB_tip_node_ScriptAxis = The vessel's actual control state, after autopilot/SAS has fed in
		// Hover on a Vessel State term's name in the tree.
		#LOC_KRAB_tip_node_PhysicalState = A live physical reading: speed, altitude, pressure, etc.
		// Hover on an Action Group term's name in the tree.
		#LOC_KRAB_tip_node_ActionGroupState = An action group's on/off state, as 0 or 1
		// Hover on a Part Field term's name in the tree.
		#LOC_KRAB_tip_node_PartField = A numeric or on/off field read live from a specific part, chosen by clicking it in the scene
		// Hover on a Weighted Sum group's name in the tree.
		#LOC_KRAB_tip_node_WeightedSum = Adds its inputs together. The 'w' field is a comma-separated list, one weight per term in the order shown (e.g. 1, 0.5, -1) — a missing entry defaults to 1
		// Hover on a Product group's name in the tree.
		#LOC_KRAB_tip_node_Product = Multiplies all of its inputs together
		// Hover on a Min group's name in the tree.
		#LOC_KRAB_tip_node_Min = The smaller of its two inputs
		// Hover on a Max group's name in the tree.
		#LOC_KRAB_tip_node_Max = The larger of its two inputs
		// Hover on a Remap term's name in the tree.
		#LOC_KRAB_tip_node_Remap = Maps an input range to an output range, linearly or with a custom curve
		// Hover on a Gated Blend term's name in the tree.
		#LOC_KRAB_tip_node_GatedBlend = Crossfades between two inputs, driven by a third control signal
		// Hover on a Derivative term's name in the tree.
		#LOC_KRAB_tip_node_Derivative = The rate of change of its input over time
		// Hover on an Integrator term's name in the tree.
		#LOC_KRAB_tip_node_Integrator = Accumulates its input over time; its gain lives in a downstream Weighted Sum's weight, not here. Second port resets it
		// Hover on a Rate Limit term's name in the tree.
		#LOC_KRAB_tip_node_SlewRate = Limits how fast its output can change per second
		// Hover on a Comparator term's name in the tree.
		#LOC_KRAB_tip_node_Comparator = Outputs 1 or 0 based on a threshold, with optional hysteresis
		// Hover on a Sine term's name in the tree.
		#LOC_KRAB_tip_node_Sin = Sine of its input. Input is in degrees, like every other angle in KRAB
		// Hover on a Cosine term's name in the tree.
		#LOC_KRAB_tip_node_Cos = Cosine of its input. Input is in degrees, like every other angle in KRAB
		// Hover on a Tangent term's name in the tree.
		#LOC_KRAB_tip_node_Tan = Tangent of its input. Input is in degrees, like every other angle in KRAB
		// Hover on an Arcsine term's name in the tree.
		#LOC_KRAB_tip_node_Asin = Arcsine of its input (clamped to -1..1). Output is in degrees
		// Hover on an Arccosine term's name in the tree.
		#LOC_KRAB_tip_node_Acos = Arccosine of its input (clamped to -1..1). Output is in degrees
		// Hover on an Arctangent term's name in the tree.
		#LOC_KRAB_tip_node_Atan = Arctangent of its input. Output is in degrees
		// Hover on an Arctangent2 term's name in the tree.
		#LOC_KRAB_tip_node_Atan2 = Two-argument arctangent: port 0 is y, port 1 is x (same order as Mathf.Atan2). Output is in degrees
		// Hover on a Hold term's name in the tree.
		#LOC_KRAB_tip_node_Hold = Sample-and-hold: tracks or latches its input, gated by a second signal
		// Hover on Hold's track/latch mode toggle button (shows the current mode as its label).
		#LOC_KRAB_tip_holdMode = track: follows the signal while the gate is high, freezes when low. latch: captures on the gate's rising edge, holds until reset
		// Hover on an All (AND) group's name in the tree.
		#LOC_KRAB_tip_node_And = True only if every input is true
		// Hover on an Any (OR) group's name in the tree.
		#LOC_KRAB_tip_node_Or = True if any input is true
		// Hover on a Not term's name in the tree.
		#LOC_KRAB_tip_node_Not = Inverts its single input
		// Hover on an Either (XOR) group's name in the tree.
		#LOC_KRAB_tip_node_Xor = True if exactly one of its two inputs is true
		// Hover on an Axis Output's name (shown when it has no custom tab name).
		#LOC_KRAB_tip_node_AxisOutput = Writes its value into a part's field: a servo angle, throttle, etc.
		// Hover on an Action Trigger's name (shown when it has no custom tab name).
		#LOC_KRAB_tip_node_ActionTrigger = Fires a part action when its input crosses a threshold

		// Validation messages — the editor's validation strip (bottom of the tree
		// area), one line per issue found in the graph (KrabGraph.Validate). Most of
		// these need a hand-edited save file to trigger; a few (tooFewInputs,
		// portUnconnected, noActiveOutput, nodeOrphan) can show up from normal
		// editing. The <<n>> placeholders are always node ids, subtype names, port
		// numbers or counts — never full sentences, so word order stays safe to
		// rearrange per language.

		// A NODE entry has no id and can never be linked to. <<1>> = its subtype name.
		#LOC_KRAB_issue_nodeMissingId = A node has no id (subtype '<<1>>') and can't be linked to
		// Two NODE entries share the same id; links resolve to the first one. <<1>> = the duplicated id.
		#LOC_KRAB_issue_nodeDuplicateId = Duplicate node id '<<1>>' — links resolve to the first one found
		// A node's declared type doesn't match its subtype's real kind (e.g. a SOURCE entry naming an OPERATOR subtype) — disabled, not dropped. <<1>> = node id, <<2>> = subtype name, <<3>> = the subtype's real kind, <<4>> = the declared (wrong) type.
		#LOC_KRAB_issue_nodeWrongKind = Node '<<1>>' disabled: subtype '<<2>>' belongs to a different kind (<<3>>), not '<<4>>'
		// A node's subtype isn't recognized at all (likely written by a newer mod version) — disabled, not dropped. <<1>> = node id, <<2>> = the unrecognized subtype name.
		#LOC_KRAB_issue_nodeUnknownSubtype = Node '<<1>>' disabled: unknown subtype '<<2>>' (from a newer mod version?)
		// A LINK's "from" or "to" node id doesn't exist in the graph. <<1>> = the link, shown as "fromId -> toId:port".
		#LOC_KRAB_issue_linkDangling = A link (<<1>>) references a node that doesn't exist
		// A LINK originates from an Output node, which has no output port to link out of. <<1>> = the link.
		#LOC_KRAB_issue_linkFromOutput = A link (<<1>>) starts from an output, which has nothing to link out of
		// A LINK targets a Source node, which has no input ports. <<1>> = the link.
		#LOC_KRAB_issue_linkIntoSource = A link (<<1>>) targets a source, which has no input ports
		// A LINK's target port number is negative. <<1>> = the link.
		#LOC_KRAB_issue_linkBadPort = A link (<<1>>) has an invalid port number
		// Two different LINK entries both target the same node+port. <<1>> = node id, <<2>> = port number.
		#LOC_KRAB_issue_portMultipleLinks = Node '<<1>>' port <<2>> has more than one incoming link
		// A DEFAULT entry's node id doesn't exist in the graph. <<1>> = that node id.
		#LOC_KRAB_issue_defaultDangling = A default value refers to a node that doesn't exist ('<<1>>')
		// A port has both a real link and a DEFAULT entry; the DEFAULT is ignored (not an error, just redundant). <<1>> = node id, <<2>> = port number.
		#LOC_KRAB_issue_defaultShadowed = Node '<<1>>' port <<2>> has both a link and a default value — the default is ignored
		// Two different DEFAULT entries both target the same node+port. <<1>> = node id, <<2>> = port number.
		#LOC_KRAB_issue_defaultDuplicate = Node '<<1>>' port <<2>> has more than one default value
		// A dynamic-arity node (Weighted Sum, And, Or, ...) has fewer terms than its minimum. Reachable by removing terms down past the minimum. <<1>> = node id, <<2>> = subtype name, <<3>> = how many terms it currently has, <<4>> = the minimum required.
		#LOC_KRAB_issue_tooFewInputs = Node '<<1>>' (<<2>>) has <<3>> input(s), needs at least <<4>>
		// A required input port has neither a link nor a default value. <<1>> = node id, <<2>> = subtype name, <<3>> = port number.
		#LOC_KRAB_issue_portUnconnected = Node '<<1>>' (<<2>>) port <<3>> is not connected to anything
		// No Output node in the graph has its port 0 covered — the graph is built but drives nothing. No placeholders.
		#LOC_KRAB_issue_noActiveOutput = No output is connected — this graph doesn't drive anything yet
		// A node exists but isn't reachable from any output (harmless, just flagged for the player's awareness). <<1>> = node id, <<2>> = subtype name.
		#LOC_KRAB_issue_nodeOrphan = Node '<<1>>' (<<2>>) doesn't feed any output
		// The graph's wiring loops back on itself. <<1>> = the cycle, shown as a chain of node ids ("n3 -> n4 -> n3").
		#LOC_KRAB_issue_graphCycle = Cycle detected: <<1>>
		// A Part Field source was bound to a part/field that no longer resolves (part gone, module changed) — UI-only check, added live by KrabEditorWindow rather than KrabGraph.Validate() since it needs a loaded scene. <<1>> = node id.
		#LOC_KRAB_issue_partFieldMissing = Node '<<1>>': Part Field target no longer found

		// Graph status (PAW)

		// PAW field label for the graph's compile-status readout.
		#LOC_KRAB_graphStatus = KRAB Graph
		// Status value shown when the controller has no graph yet.
		#LOC_KRAB_statusNone = none
		// Status value shown when the graph compiled with no errors. <<1>> = number of nodes.
		#LOC_KRAB_statusOk = <<1>> node(s), valid
		// Status value shown when the graph has validation errors (details go to the log, not this line). <<1>> = number of errors.
		#LOC_KRAB_statusErrors = invalid: <<1>> error(s), see log

		// Development aids (visible only with debugMode = true in the part cfg)

		// PAW event that runs the in-code graph self-test and prints PASS/FAIL to the screen.
		#LOC_KRAB_selfTest = KRAB: run graph self-test
		// Screen message after the self-test succeeds.
		#LOC_KRAB_selfTestPass = KRAB graph self-test: PASS
		// Screen message after the self-test fails (details go to KSP.log).
		#LOC_KRAB_selfTestFail = KRAB graph self-test: FAIL (see KSP.log)
		// PAW debug field showing the first AxisOutput's live value.
		#LOC_KRAB_debugOutput = KRAB Out[0]
		// PAW event that wires the graph's first AxisOutput to the vessel's first servo axis, for quick end-to-end testing.
		#LOC_KRAB_debugBind = KRAB: bind output to first servo
		// Screen message after a successful debug bind. <<1>> = the part's name, <<2>> = the axis field's name.
		#LOC_KRAB_debugBindDone = KRAB output bound to <<1>> (<<2>>)
		// Screen message when the debug bind can't find anything to bind.
		#LOC_KRAB_debugBindFail = No AxisOutput in graph or no servo axis on this vessel
		// PAW event that wires the graph's ActionTriggers to the vessel's first light, for quick end-to-end testing.
		#LOC_KRAB_debugBindLight = KRAB: bind triggers to first light
		// Screen message after a successful debug trigger bind. <<1>> = the part's name.
		#LOC_KRAB_debugBindLightDone = KRAB triggers bound to <<1>>
		// Screen message when the debug trigger bind can't find anything to bind.
		#LOC_KRAB_debugBindLightFail = No ActionTrigger in graph or no light on this vessel

		// Loading screen tips — shown during game loading, only if the optional
		// LoadingTipsPlus mod is installed (Config/LoadingTips.ltp lists them).
		// Style: a short "doing something absurd right now" line ending in "...",
		// matching the convention of the mods that already ship tips. Humour is
		// crab puns and logic gates; keep both when translating, and keep the
		// present-tense-first-person voice that Italian tips use.

		// Crab claws, sharpened like tools before a job.
		#LOC_KRAB_loadtip_01 = Sharpening the claws...
		// The Crab Nebula, used absurdly as a navigation reference.
		#LOC_KRAB_loadtip_02 = Triangulating against the Crab Nebula...
		// XOR is true for exactly one input — never for both at once.
		#LOC_KRAB_loadtip_03 = Explaining to XOR that it can't have both...
		// AND is true only when every single input agrees.
		#LOC_KRAB_loadtip_04 = Waiting for AND to get everyone to agree...
		// KRAB's own boolean convention: any signal >= 0.5 counts as true.
		#LOC_KRAB_loadtip_05 = Rounding truth down to 0.5...
	}
}
