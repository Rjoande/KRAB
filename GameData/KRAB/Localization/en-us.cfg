		#LOC_KRAB_input1 = KRAB Input 1
		// PAW/Action-Group-editor label for KRAB input slot 2.
		#LOC_KRAB_input2 = KRAB Input 2
		// PAW/Action-Group-editor label for KRAB input slot 3.
		#LOC_KRAB_input3 = KRAB Input 3
		// PAW/Action-Group-editor label for KRAB input slot 4.
		#LOC_KRAB_input4 = KRAB Input 4
		// KSPAction name in the action-group editor: flips enabled/disabled.
		#LOC_KRAB_actionToggle = Toggle KRAB Controller
