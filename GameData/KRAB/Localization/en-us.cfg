		// Parameter abbreviation tooltips (2026-08-22) — the short field labels in the
		// tree (w, thr, hys, τ, ×, /s, clamp, s, in/out min-max) had no explanation
		// anywhere; these are the known-limitation gap the README used to list.

		// Hover on the "w" label next to a Weighted Sum's weights field.
		#LOC_KRAB_tip_paramWeights = Comma-separated, one weight per term in the order shown (e.g. 1, 0.5, -1). A missing entry defaults to 1.
		// Hover on the "clamp" label shown once a Weighted Sum/Integrator's clamp fields are visible.
		#LOC_KRAB_tip_paramClamp = Result is capped to this min/max range.
		// Hover on the "s" label next to a Vessel State term's sample-rate field (flight only).
		#LOC_KRAB_tip_paramSampleRate = How often this source re-samples the vessel, in seconds. Flight only (the VAB/SPH simulator ignores it).
		// Hover on the "thr" label, Gated Blend or Comparator.
		#LOC_KRAB_tip_paramThreshold = Threshold. The value the control signal is compared against.
		// Hover on the "hys" label, Gated Blend or Comparator.
		#LOC_KRAB_tip_paramHysteresis = Hysteresis. A dead band around the threshold so the output doesn't flicker near it.
		// Hover on the "band" label, Gated Blend.
		#LOC_KRAB_tip_paramBand = Width of the crossfade zone centered on the threshold. 0 makes this a hard switch instead of a blend.
		// Hover on the "τ" label, Derivative.
		#LOC_KRAB_tip_paramTau = The smoothing time constant, in seconds. Higher is smoother but slower to react; 0 disables smoothing.
		// Hover on the "×" label, Derivative.
		#LOC_KRAB_tip_paramScale = Multiplies the raw derivative (given in units per second) before the result feeds onward.
		// Hover on the "/s" label, Rate Limit.
		#LOC_KRAB_tip_paramRatePerSecond = How much the output may change per second, at most. 0 or less means no limit.
		// Hover on the "inMin"/"inMax" labels on an Axis Output's target card.
		#LOC_KRAB_tip_paramInRange = The signal range this output expects, remapped onto the target field's real range (e.g. a hinge's actual degrees).
		// Hover on the "in (min-max)"/"out (min-max)" labels, Remap without a curve.
		#LOC_KRAB_tip_paramRemapRange = Input range gets linearly mapped onto the output range below.
		// Hover on the single display-unit symbol shown when a Vessel State metric has only one unit option.
		#LOC_KRAB_tip_paramUnitSymbol = Display unit for this signal. Changes only how the number is shown, never the value KRAB actually uses.

