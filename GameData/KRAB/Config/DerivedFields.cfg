// Extra Part Field picker candidates read via reflection instead of
// PartModule.Fields (see src/DerivedFields.cs). Exist for values whose stock
// KSPField readout is stale in some scene — verified case by case on the
// decompiled source, see notes/design-governor-eliche.md §8.1.
//
// Extensible via ModuleManager from any mod:
//   module        = PartModule class name (subclasses are matched too)
//   member        = field OR zero-arg method name to read via reflection (public
//                   or non-public, declared on the module or any base class)
//   addMember     = optional second field/method, added to member's value
//   refreshMethod = optional zero-arg void method invoked right before member is
//                   read — for values only ever refreshed as a side effect of a
//                   call the game normally makes from behind a PAW gate
//   replaces      = optional KSPField name hidden from the picker for this module
//                   (only while this entry is present — no entry, no hiding)
//   label         = #LOC_ key or literal string shown in the picker/tree
//   units         = display-only unit suffix, no conversion applied
//
// ModuleRoboticServoRotor.currentRPM only refreshes every ~0.3s, and only
// while that part's PAW is open (UpdatePAWUI gated on partActionMenuOpen) —
// frozen the rest of the time. transformRateOfMotion (BaseServo, internal) is
// the live, already-smoothed value the stock readout is itself copied from.
KRAB_DERIVED_FIELD
{
	module = ModuleRoboticServoRotor
	member = transformRateOfMotion
	replaces = currentRPM
	label = #LOC_KRAB_derived_rpm
	units = rpm
}

// Same freeze-behind-a-closed-PAW issue as the rotor, on ModuleRoboticServoHinge's
// currentAngle. currentTransformAngle() is the method the stock field copies
// from; the hinge adds modelInitialAngle on top (verified: ModuleRoboticRotationServo's
// own currentAngle does NOT add this offset, hence the separate entry below).
KRAB_DERIVED_FIELD
{
	module = ModuleRoboticServoHinge
	member = currentTransformAngle
	addMember = modelInitialAngle
	replaces = currentAngle
	label = #LOC_KRAB_derived_angle
	units = deg
}

// ModuleRoboticRotationServo's own currentAngle, same issue, no offset term.
KRAB_DERIVED_FIELD
{
	module = ModuleRoboticRotationServo
	member = currentTransformAngle
	replaces = currentAngle
	label = #LOC_KRAB_derived_angle
	units = deg
}

// ModuleControlSurface.angleOfAttack is a real KSPField, but it's written only
// inside CalcAngleOfAttack(), itself called only from behind
// `if (partActionWindowOpen)` — frozen at the value it had when the PAW was
// last open, useless as a control signal on its own. CalcAngleOfAttack() reads
// already-live physics state (updated every FixedUpdate) — the freeze is only
// in when the game calls it, not in the data. Calling it ourselves first makes
// the value live at KRAB's own evaluation rate, cheap (a couple of vector ops,
// no allocation, no physics query).
KRAB_DERIVED_FIELD
{
	module = ModuleControlSurface
	refreshMethod = CalcAngleOfAttack
	member = angleOfAttack
	replaces = angleOfAttack
	label = #LOC_KRAB_derived_aoa
	units = deg
}
